name: FOLD release observer
on:
  push:
    branches: [verification/fold-observer]
permissions:
  contents: write
  actions: read
concurrency:
  group: fold-release-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Observe release checks and verify published media
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/observe-forge-release.mjs
