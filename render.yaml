# Source preflight confirmed zero personal records and zero uploaded files.
# The seed retains all four public catalog rows, including original IDs/dates.
# These are the actual URLs supplied by the owner after Render provisioning.
envVarGroups:
  - name: nexus-production
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXUS_DEPLOYMENT
        value: render
      - key: NEXUS_WEB_ORIGIN
        value: https://nexus-web-ylcv.onrender.com
      - key: NEXUS_MULTIPLAYER_ORIGIN
        value: https://nexus-multiplayer.onrender.com
      - key: NEXUS_LIVE
        value: '1'
      - key: MULTIPLAYER_SECRET
        generateValue: true

databases:
  - name: nexus-database
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: '16'
    databaseName: nexus
    user: nexus
    diskSizeGB: 5
    ipAllowList: []

services:
  - type: web
    name: nexus-multiplayer
    runtime: docker
    repo: https://github.com/boyyhbm/SS-
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerfilePath: ./deploy/railway/Dockerfile.multiplayer
    dockerContext: .
    preDeployCommand: node scripts/release.mjs
    healthCheckPath: /live
    maxShutdownDelaySeconds: 10
    envVars:
      - fromGroup: nexus-production
      - key: PORT
        value: '10000'
      - key: NEXUS_SERVICE
        value: multiplayer
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-database
          property: connectionString

  - type: web
    name: nexus-web
    runtime: docker
    repo: https://github.com/boyyhbm/SS-
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerfilePath: ./deploy/railway/Dockerfile.web
    dockerContext: .
    preDeployCommand: node scripts/release.mjs
    healthCheckPath: /api/health
    disk:
      name: nexus-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: nexus-production
      - key: PORT
        value: '10000'
      - key: NEXUS_SERVICE
        value: web
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'false'
      - key: NEXUS_UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-database
          property: connectionString
      - key: NEXUS_MULTIPLAYER_PRIVATE_HOSTPORT
        fromService:
          name: nexus-multiplayer
          type: web
          property: hostport
